[project]
name = "eip-pipeline"
version = "0.1.0"
description = "ESDS EIP web scraping, enrichment, and ICP handoff pipeline"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "psycopg[binary]>=3.1,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<9",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
# Real browser rendering for JS-heavy sources (collection stage). Absent -> HttpxFetcher only.
browser = ["camoufox>=0.4"]
# Scanned-PDF OCR (processing stage). Absent -> OCR is skipped, doc routed to manual review.
ocr = ["pytesseract>=0.3", "pdf2image>=1.17", "Pillow>=10.3"]
# Native (non-scanned) PDF text extraction. Absent -> PDF text extraction is skipped.
pdf = ["pypdf>=4.2"]
# Language detection (processing stage). Absent -> detected_language stays NULL.
lang = ["langdetect>=1.0.9"]
# Regional-language -> English translation (processing stage). Absent -> translation is skipped.
translate = ["torch>=2.2", "transformers>=4.40", "sentencepiece>=0.2"]
# LLM extraction via the real Anthropic API (extraction stage). Absent -> StubExtractionEngine only.
llm = ["anthropic>=0.34"]
# Everything above, for a full-capability install.
full = ["eip-pipeline[browser,ocr,pdf,lang,translate,llm]"]

dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "types-psycopg2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[project.scripts]
eip-pipeline = "pipeline.cli:app"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
