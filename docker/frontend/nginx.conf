server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hash-based routing (#/whatever) never hits the server -- every request
  # is a real file path (index.html, assets/*, data/*), so no SPA rewrite
  # rules are needed, just a plain static file server.
  location / {
    try_files $uri $uri/ =404;
  }

  # Large GeoJSON should be gzipped in transit.
  gzip on;
  gzip_types application/json text/css application/javascript;
  gzip_min_length 1024;
}
